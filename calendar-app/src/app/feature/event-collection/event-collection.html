<div class="collection-container">
    <h2></h2>
    <hr />

    @if (loading()) {
    <div class="spinner">Loading from PHP API...</div>
    } @else {
    <!--event-grid-->
    <div class="event-list-container">
        @for (item of events(); track item.google_event_id) {
        <app-calendar-event-tile [event]="item"></app-calendar-event-tile>
        } @empty {
        <p>No events found in the database.</p>
        }
    </div>
    }
</div>
